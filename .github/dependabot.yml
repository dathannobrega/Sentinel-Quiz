version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

  # Base images pinned by digest in the Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /
      - /web
      - /docker/nginx
    schedule:
      interval: weekly

  # postgres / redis images pinned by digest in the compose files.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  # Actions pinned by commit SHA in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
