name: CI

# Checks run on every PR and push. Images are published to GHCR only after all
# checks and the image scan pass, and only for pushes to main, v* tags or a
# manual dispatch. Tags: sha-<short sha> always (immutable, pin these for
# rollback); "latest" and "main" follow the newest main build; <version> and
# <major>.<minor> on v* tags.
#
# Third-party actions are pinned to full commit SHAs (Dependabot updates them).

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: sentinel_test
          POSTGRES_USER: sentinel_test
          POSTGRES_PASSWORD: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel_test -d sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://sentinel_test:sentinel_test@localhost:5432/sentinel_test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Runtime deps exactly as shipped in the image (hash-checked), then test tooling.
          python -m pip install --require-hashes -r backend/requirements.lock
          python -m pip install -r backend/requirements-dev.txt

      - name: Check requirements.lock is in sync with requirements.txt
        # Seeded with the committed lock: pip-compile keeps every pin that still satisfies
        # requirements.txt, so this fails only when requirements.txt changed without
        # regenerating the lock, not whenever PyPI publishes a newer transitive dependency.
        run: |
          python -m pip install pip-tools
          cp backend/requirements.lock /tmp/requirements.lock
          pip-compile --quiet --allow-unsafe --generate-hashes --strip-extras \
            --output-file=/tmp/requirements.lock backend/requirements.txt
          diff <(grep -v '^#' backend/requirements.lock) <(grep -v '^#' /tmp/requirements.lock)

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q

      - name: Audit Python dependencies (pip-audit)
        run: pip-audit --require-hashes -r backend/requirements.lock

  content-validate:
    name: content-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install --require-hashes -r backend/requirements.lock

      - name: Validate question bank
        # questions/*.json (incl. PBQs) and questions/imports/*.json (provenance required).
        run: python scripts/validate_content.py

      - name: Validate external sources registry
        run: python -m scripts.question_sources list

      - name: Validate compose stacks (portainer == base + prod)
        run: scripts/check_compose.sh

  speech-tests:
    name: speech-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: speech
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: speech/uv.lock

      - name: System packages (espeak-ng, ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends espeak-ng ffmpeg

      - name: Install dependencies (CPU-only torch)
        # uv sync would pull the CUDA torch wheels (~3 GB of nvidia-*). Export the locked
        # versions, drop the CUDA packages and let uv take torch from the CPU index.
        run: |
          uv venv --python 3.12
          uv export --frozen --no-hashes --no-emit-project --group dev | grep -v -E '^(nvidia-|triton)' > /tmp/speech-req.txt
          uv pip install --torch-backend cpu -r /tmp/speech-req.txt
          uv pip install --no-deps -e .

      - name: Tests (fake engines, no model downloads)
        run: uv run --no-sync pytest -q

  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: e2e
    needs:
      - web-checks
      - backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # web/e2e/global-setup.ts starts uvicorn (SQLite temp DB, fixture questions, seeded admin)
      # and `next build` + `next start` on free ports.
      E2E_PYTHON: python
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install backend dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Playwright E2E (installs Chromium in CI)
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  image-scan:
    name: image-scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: ./Dockerfile
          - image: web
            context: ./web
            file: ./web/Dockerfile
          - image: proxy
            context: ./docker/nginx
            file: ./docker/nginx/Dockerfile
          - image: speech
            context: ./speech
            file: ./speech/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: sentinel-quiz-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image with Trivy (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel-quiz-${{ matrix.image }}:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  publish:
    name: publish (${{ matrix.image }})
    if: github.event_name != 'pull_request'
    needs:
      - backend-tests
      - content-validate
      - speech-tests
      - web-checks
      - image-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            suffix: ""
            context: .
            file: ./Dockerfile
          - image: web
            suffix: "-web"
            context: ./web
            file: ./web/Dockerfile
          - image: proxy
            suffix: "-proxy"
            context: ./docker/nginx
            file: ./docker/nginx/Dockerfile
          - image: speech
            suffix: "-speech"
            context: ./speech
            file: ./speech/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare image name
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
