# Security headers for the non-Next.js locations (/api...). Included per
# location because any add_header inside a location disables inheritance of
# the server-level ones, so HSTS is repeated here.
# Values mirror web/next.config.mjs (securityHeaders) — keep them in sync.

# Drop upstream copies so each header appears exactly once.
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
