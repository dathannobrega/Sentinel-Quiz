# Sentinel Quiz main nginx configuration (replaces the image default).
#
# Sized for Sentinel Arena: every live participant keeps one WebSocket (or SSE stream),
# and nginx holds two connections per proxied socket (client + upstream). The image
# default (1024 connections per worker, default file limit) tops out below ~1,000
# participants on a small host. 16,384 connections per worker covers 2,000+ people in
# one room on a single worker, with room for the rest of the site.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 16384;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  include /etc/nginx/conf.d/*.conf;
}
