<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Sem conexão · Sentinel Quiz</title>
    <!--
      Served by public/sw.js when a page load fails offline (installed app or browser). Static, no
      scripts (the CSP only allows nonce'd scripts); colours mirror styles/theme.css.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f5f7;
        --surface: #ffffff;
        --fg: #161a22;
        --muted: #4a5261;
        --line: #dce0e6;
        --primary: #2544c4;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0f1115;
          --surface: #161920;
          --fg: #e8eaef;
          --muted: #b4bac6;
          --line: #2b303b;
          --primary: #8ea2ff;
          --on-primary: #0f1115;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
        background: var(--canvas);
        color: var(--fg);
        font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(26rem, 100%);
        padding: 2rem 1.5rem;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        text-align: center;
      }
      .mark {
        display: block;
        margin: 0 auto 1.25rem;
      }
      .mark .dot {
        fill: var(--primary);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 0.25rem;
        color: var(--muted);
      }
      p[lang="en"] {
        font-size: 0.8125rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        margin-top: 1.5rem;
        padding: 0 1.25rem;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" width="48" height="48" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="11" fill="none" stroke="currentColor" stroke-width="2" />
        <circle class="dot" cx="12" cy="12" r="5" />
      </svg>
      <h1>Você está sem conexão</h1>
      <p>Não foi possível carregar esta página. Verifique a internet e tente de novo.</p>
      <p lang="en">You are offline: this page could not load. Check your connection and try again.</p>
      <!-- Empty href = the address that failed to load (this page is served in its place). -->
      <a href="">Tentar novamente · Try again</a>
    </main>
  </body>
</html>
