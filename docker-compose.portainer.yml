services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-sentinel_quiz}
      POSTGRES_USER: ${APP_POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-sentinel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-sentinel} -d ${APP_POSTGRES_DB:-sentinel_quiz}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    container_name: ${APP_CONTAINER_NAME:-sentinel-quiz}
    image: ${APP_IMAGE_NAME:-ghcr.io/owner/sentinel-quiz:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      QUESTION_JSON_DIR: /questions
      DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://sentinel:sentinel@postgres:5432/sentinel_quiz}
      BOOTSTRAP_SCHEMA: ${APP_BOOTSTRAP_SCHEMA:-false}
      RUN_DB_MIGRATIONS: ${APP_RUN_DB_MIGRATIONS:-false}
      MATERIAL_DIR: /app/material
      ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-change-me}
      ALLOW_ADMIN_API_KEY: ${APP_ALLOW_ADMIN_API_KEY:-false}
      ENFORCE_PRODUCTION_SAFETY: ${APP_ENFORCE_PRODUCTION_SAFETY:-true}
      AUTH_TOKEN_TTL_HOURS: ${APP_AUTH_TOKEN_TTL_HOURS:-168}
      AUTH_TOKEN_BYTES: ${APP_AUTH_TOKEN_BYTES:-32}
      AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-sentinel_session}
      AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAMESITE: ${APP_AUTH_COOKIE_SAMESITE:-lax}
      AUTH_COOKIE_DOMAIN: ${APP_AUTH_COOKIE_DOMAIN:-}
      LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      LOG_JSON: ${APP_LOG_JSON:-true}
      SLOW_REQUEST_THRESHOLD_MS: ${APP_SLOW_REQUEST_THRESHOLD_MS:-1200}
      TRUST_REQUEST_ID_HEADER: ${APP_TRUST_REQUEST_ID_HEADER:-true}
      RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PUBLIC_REQUESTS: ${APP_RATE_LIMIT_PUBLIC_REQUESTS:-180}
      RATE_LIMIT_PUBLIC_WINDOW_SECONDS: ${APP_RATE_LIMIT_PUBLIC_WINDOW_SECONDS:-60}
      RATE_LIMIT_AUTH_REQUESTS: ${APP_RATE_LIMIT_AUTH_REQUESTS:-40}
      RATE_LIMIT_AUTH_WINDOW_SECONDS: ${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:-60}
      RATE_LIMIT_ADMIN_REQUESTS: ${APP_RATE_LIMIT_ADMIN_REQUESTS:-60}
      RATE_LIMIT_ADMIN_WINDOW_SECONDS: ${APP_RATE_LIMIT_ADMIN_WINDOW_SECONDS:-60}
      RATE_LIMIT_CACHE_SIZE: ${APP_RATE_LIMIT_CACHE_SIZE:-50000}
      ABUSE_SIGNAL_ENABLED: ${APP_ABUSE_SIGNAL_ENABLED:-true}
      ABUSE_SIGNAL_WINDOW_SECONDS: ${APP_ABUSE_SIGNAL_WINDOW_SECONDS:-60}
      ABUSE_DISTINCT_PATH_THRESHOLD: ${APP_ABUSE_DISTINCT_PATH_THRESHOLD:-30}
      ABUSE_RATE_LIMIT_BREACH_THRESHOLD: ${APP_ABUSE_RATE_LIMIT_BREACH_THRESHOLD:-3}
      ABUSE_SIGNAL_COOLDOWN_SECONDS: ${APP_ABUSE_SIGNAL_COOLDOWN_SECONDS:-300}
      CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000,http://127.0.0.1:3000,http://localhost:3000}
      GEMINI_ENABLE: ${APP_GEMINI_ENABLE:-true}
      GEMINI_API_KEY: ${APP_GEMINI_API_KEY:-}
      GEMINI_MODEL: ${APP_GEMINI_MODEL:-gemini-1.5-flash}
      GEMINI_TIMEOUT_SECONDS: ${APP_GEMINI_TIMEOUT_SECONDS:-20}
      GEMINI_TEMPERATURE: ${APP_GEMINI_TEMPERATURE:-0.2}
      GEMINI_MAX_OUTPUT_TOKENS: ${APP_GEMINI_MAX_OUTPUT_TOKENS:-400}
      GEMINI_SYSTEM_PROMPT: ${APP_GEMINI_SYSTEM_PROMPT:-}
      GEMINI_MIN_RESPONSE_CHARS: ${APP_GEMINI_MIN_RESPONSE_CHARS:-220}
      GEMINI_RETRY_ON_SHORT: ${APP_GEMINI_RETRY_ON_SHORT:-true}
      GEMINI_CANDIDATE_COUNT: ${APP_GEMINI_CANDIDATE_COUNT:-1}
      APP_ENV_FILE: ${APP_ENV_FILE:-}
    volumes:
      - db_data:/data

  web:
    container_name: ${APP_WEB_CONTAINER_NAME:-sentinel-quiz-web}
    image: ${APP_WEB_IMAGE_NAME:-ghcr.io/owner/sentinel-quiz-web:latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_ORIGIN: ${APP_PUBLIC_API_ORIGIN:-http://localhost:8000}

volumes:
  db_data:
  postgres_data:
