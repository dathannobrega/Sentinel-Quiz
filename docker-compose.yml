# Sentinel Quiz — BASE stack: everything shared by development and production.
# Not runnable on its own (the app services have no image here): combine it with
# one environment file. COMPOSE_FILE in .env picks it, so plain `docker compose`
# commands work:
#
#   development  COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#                docker compose up --build -d          (builds :local from source)
#   production   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
#                docker compose pull && docker compose up -d   (GHCR images)
#
# or pass the files explicitly: docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
# Portainer (single-file web editor): docker-compose.portainer.yml, kept equivalent
# to base + prod by scripts/check_compose.sh (CI).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-sentinel_quiz}
      POSTGRES_USER: ${APP_POSTGRES_USER:-sentinel}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      # Postgres 18+ keeps PGDATA in a versioned subdirectory (/var/lib/postgresql/18/docker),
      # so the volume is mounted one level up. Data from the 16 volume is not reused (dump/restore).
      - postgres18_data:/var/lib/postgresql
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "${APP_POSTGRES_CPUS:-1.0}"
          memory: ${APP_POSTGRES_MEMORY:-1g}
    logging: *default-logging

  redis:
    # Rate-limit / quota counters shared by all API workers. Ephemeral by
    # design (no persistence); never published outside the "data" network.
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - data
    deploy:
      resources:
        limits:
          cpus: "${APP_REDIS_CPUS:-0.5}"
          memory: ${APP_REDIS_MEMORY:-192m}
    logging: *default-logging

  api:
    container_name: ${APP_CONTAINER_NAME:-sentinel-quiz}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Not published on the host: reachable only through the proxy.
    expose:
      - "8000"
    environment:
      # Every APP_<NAME> is exported as <NAME> by docker/entrypoint.sh.
      # Empty value = backend default. See README "Variáveis de ambiente".
      # --- runtime / schema ---
      APP_ENFORCE_PRODUCTION_SAFETY: ${APP_ENFORCE_PRODUCTION_SAFETY:-true}
      APP_RUN_DB_MIGRATIONS: ${APP_RUN_DB_MIGRATIONS:-true}
      APP_BOOTSTRAP_SCHEMA: ${APP_BOOTSTRAP_SCHEMA:-false}
      APP_STUDY_TRACK_DIR: ${APP_STUDY_TRACK_DIR:-}
      APP_EXPOSE_API_DOCS: ${APP_EXPOSE_API_DOCS:-}
      APP_UVICORN_WORKERS: ${APP_UVICORN_WORKERS:-2}
      # The API is only reachable from the proxy on the internal network, so
      # uvicorn may trust X-Forwarded-* from any peer there. Never publish
      # port 8000 with this value.
      APP_FORWARDED_ALLOW_IPS: ${APP_FORWARDED_ALLOW_IPS:-*}
      APP_TRUST_FORWARDED_FOR_HEADER: ${APP_TRUST_FORWARDED_FOR_HEADER:-true}
      APP_TRUST_REQUEST_ID_HEADER: ${APP_TRUST_REQUEST_ID_HEADER:-true}
      APP_ENV_FILE: ${APP_ENV_FILE:-}
      QUESTION_JSON_DIR: /questions
      MATERIAL_DIR: /app/material
      # --- database (empty APP_DATABASE_URL => built from APP_POSTGRES_*) ---
      APP_DATABASE_URL: ${APP_DATABASE_URL:-}
      APP_POSTGRES_HOST: postgres
      APP_POSTGRES_PORT: "5432"
      APP_POSTGRES_DB: ${APP_POSTGRES_DB:-sentinel_quiz}
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-sentinel}
      APP_DB_POOL_SIZE: ${APP_DB_POOL_SIZE:-}
      APP_DB_MAX_OVERFLOW: ${APP_DB_MAX_OVERFLOW:-}
      APP_DB_POOL_TIMEOUT: ${APP_DB_POOL_TIMEOUT:-}
      APP_DB_POOL_PRE_PING: ${APP_DB_POOL_PRE_PING:-}
      # --- web origin / CORS / cookies ---
      APP_PUBLIC_WEB_ORIGIN: ${APP_PUBLIC_WEB_ORIGIN:-}
      APP_AUTH_TOKEN_TTL_HOURS: ${APP_AUTH_TOKEN_TTL_HOURS:-}
      APP_AUTH_TOKEN_BYTES: ${APP_AUTH_TOKEN_BYTES:-}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-true}
      APP_AUTH_COOKIE_SAMESITE: ${APP_AUTH_COOKIE_SAMESITE:-}
      APP_AUTH_COOKIE_DOMAIN: ${APP_AUTH_COOKIE_DOMAIN:-}
      APP_AUTH_RETURN_TOKEN_IN_BODY: ${APP_AUTH_RETURN_TOKEN_IN_BODY:-}
      APP_AUTH_LAST_USED_THROTTLE_SECONDS: ${APP_AUTH_LAST_USED_THROTTLE_SECONDS:-}
      APP_AUTH_SLIDING_SESSION: ${APP_AUTH_SLIDING_SESSION:-}
      APP_AUTH_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${APP_AUTH_VERIFICATION_RESEND_COOLDOWN_SECONDS:-}
      APP_AUTH_EMAIL_VERIFICATION_TTL_MINUTES: ${APP_AUTH_EMAIL_VERIFICATION_TTL_MINUTES:-}
      APP_AUTH_PASSWORD_RESET_TTL_MINUTES: ${APP_AUTH_PASSWORD_RESET_TTL_MINUTES:-}
      # --- SMTP ---
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-}
      APP_SMTP_USERNAME: ${APP_SMTP_USERNAME:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_FROM_EMAIL: ${APP_SMTP_FROM_EMAIL:-}
      APP_SMTP_FROM_NAME: ${APP_SMTP_FROM_NAME:-}
      APP_SMTP_USE_TLS: ${APP_SMTP_USE_TLS:-}
      APP_SMTP_TIMEOUT_SECONDS: ${APP_SMTP_TIMEOUT_SECONDS:-}
      # --- logging ---
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-}
      APP_LOG_JSON: ${APP_LOG_JSON:-}
      APP_SLOW_REQUEST_THRESHOLD_MS: ${APP_SLOW_REQUEST_THRESHOLD_MS:-}
      # --- rate limiting / abuse signals ---
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-}
      APP_RATE_LIMIT_BACKEND: ${APP_RATE_LIMIT_BACKEND:-redis}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379/0}
      APP_RATE_LIMIT_ALLOW_MEMORY_IN_PRODUCTION: ${APP_RATE_LIMIT_ALLOW_MEMORY_IN_PRODUCTION:-}
      APP_RATE_LIMIT_AUTH_SENSITIVE_REQUESTS: ${APP_RATE_LIMIT_AUTH_SENSITIVE_REQUESTS:-}
      APP_RATE_LIMIT_AUTH_SENSITIVE_WINDOW_SECONDS: ${APP_RATE_LIMIT_AUTH_SENSITIVE_WINDOW_SECONDS:-}
      APP_RATE_LIMIT_PUBLIC_REQUESTS: ${APP_RATE_LIMIT_PUBLIC_REQUESTS:-}
      APP_RATE_LIMIT_PUBLIC_WINDOW_SECONDS: ${APP_RATE_LIMIT_PUBLIC_WINDOW_SECONDS:-}
      APP_RATE_LIMIT_AUTH_REQUESTS: ${APP_RATE_LIMIT_AUTH_REQUESTS:-}
      APP_RATE_LIMIT_AUTH_WINDOW_SECONDS: ${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:-}
      APP_RATE_LIMIT_ADMIN_REQUESTS: ${APP_RATE_LIMIT_ADMIN_REQUESTS:-}
      APP_RATE_LIMIT_ADMIN_WINDOW_SECONDS: ${APP_RATE_LIMIT_ADMIN_WINDOW_SECONDS:-}
      APP_RATE_LIMIT_CACHE_SIZE: ${APP_RATE_LIMIT_CACHE_SIZE:-}
      APP_ABUSE_SIGNAL_ENABLED: ${APP_ABUSE_SIGNAL_ENABLED:-}
      APP_ABUSE_SIGNAL_WINDOW_SECONDS: ${APP_ABUSE_SIGNAL_WINDOW_SECONDS:-}
      APP_ABUSE_DISTINCT_PATH_THRESHOLD: ${APP_ABUSE_DISTINCT_PATH_THRESHOLD:-}
      APP_ABUSE_RATE_LIMIT_BREACH_THRESHOLD: ${APP_ABUSE_RATE_LIMIT_BREACH_THRESHOLD:-}
      APP_ABUSE_SIGNAL_COOLDOWN_SECONDS: ${APP_ABUSE_SIGNAL_COOLDOWN_SECONDS:-}
      # --- AI tutor (Gemini) ---
      APP_GEMINI_ENABLE: ${APP_GEMINI_ENABLE:-}
      APP_GEMINI_API_KEY: ${APP_GEMINI_API_KEY:-}
      APP_GEMINI_MODEL: ${APP_GEMINI_MODEL:-gemini-2.5-flash}
      APP_GEMINI_THINKING_BUDGET: ${APP_GEMINI_THINKING_BUDGET:-}
      APP_GEMINI_TIMEOUT_SECONDS: ${APP_GEMINI_TIMEOUT_SECONDS:-}
      APP_GEMINI_TEMPERATURE: ${APP_GEMINI_TEMPERATURE:-}
      APP_GEMINI_MAX_OUTPUT_TOKENS: ${APP_GEMINI_MAX_OUTPUT_TOKENS:-}
      APP_GEMINI_SYSTEM_PROMPT: ${APP_GEMINI_SYSTEM_PROMPT:-}
      APP_GEMINI_MIN_RESPONSE_CHARS: ${APP_GEMINI_MIN_RESPONSE_CHARS:-}
      APP_GEMINI_RETRY_ON_SHORT: ${APP_GEMINI_RETRY_ON_SHORT:-}
      APP_GEMINI_CANDIDATE_COUNT: ${APP_GEMINI_CANDIDATE_COUNT:-}
      APP_TUTOR_DAILY_QUOTA: ${APP_TUTOR_DAILY_QUOTA:-}
      # --- Sentinel Arena: live quizzes (docs/live-quiz/CONTRATO-INCREMENTO-1.md §8) ---
      APP_LIVE_ENABLED: ${APP_LIVE_ENABLED:-false}
      APP_LIVE_HOST_POLICY: ${APP_LIVE_HOST_POLICY:-allowlist}
      APP_LIVE_HOST_ALLOWLIST: ${APP_LIVE_HOST_ALLOWLIST:-}
      APP_LIVE_TOKEN_KEYS: ${APP_LIVE_TOKEN_KEYS:-}
      # More than one uvicorn worker needs the Redis bus so every worker sees every room event.
      APP_LIVE_BUS_BACKEND: ${APP_LIVE_BUS_BACKEND:-redis}
      APP_LIVE_REDIS_URL: ${APP_LIVE_REDIS_URL:-}
      APP_LIVE_MAX_PARTICIPANTS: ${APP_LIVE_MAX_PARTICIPANTS:-}
      APP_LIVE_PLATFORM_GUEST_OK: ${APP_LIVE_PLATFORM_GUEST_OK:-false}
      # Incremento 3 (CONTRATO-INCREMENTO-3.md): limits per room code/token (never per IP),
      # SSE fallback and the internal metrics endpoint (set a token to scrape it).
      APP_RATE_LIMIT_LIVE_ROOM_REQUESTS: ${APP_RATE_LIMIT_LIVE_ROOM_REQUESTS:-}
      APP_RATE_LIMIT_LIVE_TOKEN_REQUESTS: ${APP_RATE_LIMIT_LIVE_TOKEN_REQUESTS:-}
      APP_RATE_LIMIT_LIVE_CMD_REQUESTS: ${APP_RATE_LIMIT_LIVE_CMD_REQUESTS:-}
      APP_LIVE_INVALID_CODE_LIMIT: ${APP_LIVE_INVALID_CODE_LIMIT:-}
      APP_LIVE_SSE_MAX_SECONDS: ${APP_LIVE_SSE_MAX_SECONDS:-}
      APP_LIVE_METRICS_TOKEN: ${APP_LIVE_METRICS_TOKEN:-}
      # --- Sentinel Arena: AI authoring (docs/live-quiz/CONTRATO-INCREMENTO-2.md §5) ---
      APP_AI_AUTHORING_ENABLED: ${APP_AI_AUTHORING_ENABLED:-false}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-gemini}
      APP_AI_AUTHORING_MODEL: ${APP_AI_AUTHORING_MODEL:-}
      APP_AI_CRITIC_MODEL: ${APP_AI_CRITIC_MODEL:-}
      APP_AI_CRITIC_ENABLED: ${APP_AI_CRITIC_ENABLED:-}
      APP_AI_DAILY_QUOTA_CREDITS: ${APP_AI_DAILY_QUOTA_CREDITS:-}
      APP_AI_MAX_CONCURRENT_JOBS: ${APP_AI_MAX_CONCURRENT_JOBS:-}
      APP_AI_JOB_RUNNER: ${APP_AI_JOB_RUNNER:-thread}
      APP_RATE_LIMIT_AI_REQUESTS: ${APP_RATE_LIMIT_AI_REQUESTS:-}
    networks:
      - edge
      - data
    deploy:
      resources:
        limits:
          cpus: "${APP_API_CPUS:-2.0}"
          memory: ${APP_API_MEMORY:-1g}
    logging: *default-logging

  web:
    container_name: ${APP_WEB_CONTAINER_NAME:-sentinel-quiz-web}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      # Empty = same origin as the page (calls go to https://<host>/api via
      # the proxy). Only set to force another API origin. Read at runtime by
      # the server layout; API_ORIGIN is the server-side name of the same value.
      NEXT_PUBLIC_API_ORIGIN: ${APP_PUBLIC_API_ORIGIN:-}
      API_ORIGIN: ${APP_PUBLIC_API_ORIGIN:-}
      # Session cookie checked by the /admin guard in web/middleware.ts (read
      # at request time, not at build). Must match the API's AUTH_COOKIE_NAME.
      AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-sentinel_session}
      # Browser-side timeout (ms) for AI tutor calls; injected at request time
      # into window.__SENTINEL_RUNTIME__. Keep above APP_GEMINI_TIMEOUT_SECONDS.
      TUTOR_CLIENT_TIMEOUT_MS: ${APP_TUTOR_CLIENT_TIMEOUT_MS:-45000}
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "${APP_WEB_CPUS:-1.0}"
          memory: ${APP_WEB_MEMORY:-512m}
    logging: *default-logging

  proxy:
    container_name: ${APP_NGINX_CONTAINER_NAME:-sentinel-quiz-proxy}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
    environment:
      NGINX_SERVER_ALT_NAMES: ${APP_NGINX_ALT_NAMES:-}
      NGINX_TLS_MODE: ${APP_TLS_MODE:-self-signed}
      NGINX_SSL_CERTIFICATE: ${APP_TLS_CERTIFICATE:-/etc/nginx/certs/server.crt}
      NGINX_SSL_CERTIFICATE_KEY: ${APP_TLS_CERTIFICATE_KEY:-/etc/nginx/certs/server.key}
      NGINX_CERT_DAYS: ${APP_NGINX_CERT_DAYS:-825}
      NGINX_AUTH_RATE: ${APP_NGINX_AUTH_RATE:-10r/s}
      NGINX_AUTH_BURST: ${APP_NGINX_AUTH_BURST:-20}
      NGINX_CLIENT_MAX_BODY_SIZE: ${APP_NGINX_CLIENT_MAX_BODY_SIZE:-2m}
      NGINX_WEB_HOST: web
      NGINX_WEB_PORT: "3000"
      NGINX_API_HOST: api
      NGINX_API_PORT: "8000"
    volumes:
      # Named volume (self-signed cert persisted across restarts) or a host
      # directory with your own certificate (APP_TLS_MODE=custom).
      - ${APP_TLS_CERTS_DIR:-proxy_certs}:/etc/nginx/certs
    networks:
      - edge
    deploy:
      resources:
        limits:
          cpus: "${APP_PROXY_CPUS:-0.5}"
          memory: ${APP_PROXY_MEMORY:-128m}
    logging: *default-logging

networks:
  # Proxy <-> web <-> api.
  edge:
  # api <-> postgres/redis. Internal: no host access, no egress.
  data:
    internal: true

volumes:
  postgres18_data:
  proxy_certs:
